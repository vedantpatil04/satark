services:
  - type: web
    name: satark-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: SUPABASE_URL
        value: https://ugsizlimcnxtbzkwficf.supabase.co
      - key: SUPABASE_JWKS_URL
        value: https://ugsizlimcnxtbzkwficf.supabase.co/auth/v1/.well-known/jwks.json
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: AGENT_TOKEN_SECRET
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: TEACHER_PROVISIONING_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        value: '["https://*.vercel.app","http://localhost:5173"]'
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: WEBRTC_STUN_URLS
        value: '["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302"]'
      - key: WEBRTC_TURN_URL
        sync: false
      - key: WEBRTC_TURN_USERNAME
        sync: false
      - key: WEBRTC_TURN_CREDENTIAL
        sync: false

